<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=DM+Mono:wght@400&display=block">
<style>
:root{--sumi:#161C20;--gin:#DCE2E2;--nezu:#8C9BA1;--andon:#D8B46A;--line:#33404A}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--sumi)}
.card{position:relative;width:1200px;height:630px;background:linear-gradient(180deg,#141A1E,#0C1013);color:var(--gin);font-family:"Zen Kaku Gothic New",sans-serif}
canvas{position:absolute;inset:0}
.txt{position:absolute;left:72px;top:64px;width:560px}
.mark{display:flex;align-items:flex-start;gap:18px}
.mark h1{margin:0;font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:176px;line-height:1;letter-spacing:.02em}
.mark span{writing-mode:vertical-rl;font-family:"Shippori Mincho B1",serif;font-weight:500;font-size:22px;letter-spacing:.5em;color:var(--nezu);padding-top:10px}
.copy{margin:34px 0 0;font-family:"Shippori Mincho B1",serif;font-weight:500;font-size:33px;line-height:1.55;letter-spacing:.06em}
.places{margin:20px 0 0;font-size:19px;letter-spacing:.08em;color:var(--nezu)}
.places b{color:var(--andon);font-weight:500}
.strip{margin:30px 0 0;display:flex;align-items:center;gap:16px;font-family:"DM Mono",monospace;font-size:17px;color:var(--nezu)}
.strip i{display:block;width:300px;height:7px;border-radius:1px}
.foot{margin:24px 0 0;font-size:17px;letter-spacing:.12em;color:var(--nezu)}
</style>
</head>
<body>
<div class="card">
  <canvas id="cv" width="1200" height="630"></canvas>
  <div class="txt">
    <div class="mark"><h1>雨音</h1><span>あまおと</span></div>
    <p class="copy">雨が当たる場所と強さを選んで、<br>雨音を聴く。</p>
    <p class="places">窓ガラス・番傘・トタン屋根・瓦・テント…　<b>12か所</b></p>
    <div class="strip"><i id="strip"></i><span>0.5–100 mm/h</span></div>
    <!-- 左下は X のカードでドメイン名が重なるため、何も置かない -->
    <p class="foot">音は録音ではなく、ブラウザの中でひと粒ずつ合成</p>
  </div>
</div>
<script>
// 決定的な乱数（毎回同じ絵になるように）
let seed=11;const R=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const rnd=(a,b)=>a+R()*(b-a),TAU=Math.PI*2;
const W=1200,H=630,c=document.getElementById('cv').getContext('2d');

// 雨雲レーダーの色帯（アプリと同じ配色・対数目盛）
const RADAR=[[0.5,1,'#F2F2FF'],[1,5,'#A0D2FF'],[5,10,'#218CFF'],[10,20,'#0041FF'],[20,30,'#FAF500'],[30,50,'#FF9900'],[50,80,'#FF2800'],[80,100,'#B40068']];
const pos=m=>Math.log(m/.5)/Math.log(200)*100;
document.getElementById('strip').style.background='linear-gradient(90deg,'+RADAR.map(([a,b,col])=>`${col} ${pos(a).toFixed(2)}% ${pos(b).toFixed(2)}%`).join(',')+')';

// 窓（アプリの drawGlass を下敷きにした、夜の窓辺）
const x0=680,x1=1140,y0=62,y1=500,xm=(x0+x1)/2;

// 室内の明かり（窓の左下から、行灯色がほのかに）
const room=c.createRadialGradient(560,560,0,560,560,520);
room.addColorStop(0,'rgba(216,180,106,.10)');room.addColorStop(1,'rgba(216,180,106,0)');
c.fillStyle=room;c.fillRect(0,0,W,H);

c.save();c.beginPath();c.rect(x0,y0,x1-x0,y1-y0);c.clip();
// 外の空
const sky=c.createLinearGradient(0,y0,0,y1);sky.addColorStop(0,'#2A353C');sky.addColorStop(1,'#1B2429');
c.fillStyle=sky;c.fillRect(x0,y0,x1-x0,y1-y0);
// 遠くの街（ビルと灯り）
for(let x=x0-20;x<x1;){
  const bw=rnd(40,105),bh=(y1-y0)*rnd(.14,.40);
  c.fillStyle='#141B1F';c.fillRect(x,y1-bh,bw,bh);
  const nl=3+((R()*6)|0);
  for(let i=0;i<nl;i++){c.fillStyle=`rgba(216,180,106,${rnd(.3,.6).toFixed(2)})`;c.fillRect(x+bw*rnd(.12,.82),y1-bh+bh*rnd(.12,.8),4,5)}
  x+=bw+rnd(2,14);
}
// 雨ににじむ街灯り（ガラス越しのぼけ）
for(let i=0;i<16;i++){
  const bx=rnd(x0,x1),by=rnd(y1-(y1-y0)*.55,y1-10),br=rnd(14,34),warm=R()<.7;
  const g=c.createRadialGradient(bx,by,0,bx,by,br);
  const col=warm?'216,180,106':'170,200,220',a=rnd(.10,.22);
  g.addColorStop(0,`rgba(${col},${a.toFixed(2)})`);g.addColorStop(.7,`rgba(${col},${(a*.5).toFixed(2)})`);g.addColorStop(1,`rgba(${col},0)`);
  c.fillStyle=g;c.fillRect(bx-br,by-br,br*2,br*2);
}
// ガラス越しの雨（こもって見えるよう細く淡く）
const w=.1;
c.lineWidth=.8;c.strokeStyle='rgba(190,205,212,.16)';c.beginPath();
for(let i=0;i<340;i++){const x=rnd(x0-30,x1),y=rnd(y0,y1+20),l=rnd(8,14);c.moveTo(x,y);c.lineTo(x-l*w,y-l)}c.stroke();
c.lineWidth=1;c.strokeStyle='rgba(205,218,224,.28)';c.beginPath();
for(let i=0;i<120;i++){const x=rnd(x0-30,x1),y=rnd(y0,y1+30),l=rnd(16,28);c.moveTo(x,y);c.lineTo(x-l*w,y-l)}c.stroke();

// ガラスの水滴
const drop=(x,y,r)=>{
  c.fillStyle='rgba(190,205,212,.22)';c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  c.fillStyle='rgba(255,255,255,.34)';c.beginPath();c.arc(x-r*.3,y-r*.3,r*.35,0,TAU);c.fill();
};
for(let i=0;i<300;i++){const x=rnd(x0,x1),y=rnd(y0,y1);drop(x,y,rnd(1,3.2))}
// 流れ落ちる大きめの粒と、その跡
for(let i=0;i<9;i++){
  const x=rnd(x0+15,x1-15),yEnd=rnd(y0+120,y1-10),len=rnd(60,180),r=rnd(3.2,4.6);
  const tr=c.createLinearGradient(0,yEnd-len,0,yEnd);tr.addColorStop(0,'rgba(190,205,212,0)');tr.addColorStop(1,'rgba(190,205,212,.22)');
  c.strokeStyle=tr;c.lineWidth=r*.9;c.lineCap='round';c.beginPath();c.moveTo(x+rnd(-3,3),yEnd-len);c.quadraticCurveTo(x+rnd(-5,5),yEnd-len/2,x,yEnd);c.stroke();
  for(let k=0;k<4;k++)drop(x+rnd(-2,2),yEnd-len*rnd(.2,.9),rnd(.8,1.5));
  drop(x,yEnd,r);
}
c.lineCap='butt';
c.restore();

// 窓枠・中桟・窓台
c.strokeStyle='#2A3338';c.lineWidth=10;c.strokeRect(x0,y0,x1-x0,y1-y0);
c.fillStyle='#2A3338';c.fillRect(xm-5,y0,10,y1-y0);
c.strokeStyle='rgba(190,202,206,.25)';c.lineWidth=1;c.strokeRect(x0-6,y0-6,x1-x0+12,y1-y0+12);
c.fillStyle='#232B30';c.fillRect(x0-20,y1+6,x1-x0+40,10);
c.fillStyle='rgba(216,180,106,.12)';c.fillRect(x0-20,y1+6,x1-x0+40,2);
</script>
</body>
</html>
