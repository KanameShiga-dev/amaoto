<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=DM+Mono:wght@400&display=block">
<style>
:root{--sumi:#161C20;--gin:#DCE2E2;--nezu:#8C9BA1;--andon:#D8B46A;--line:#33404A}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--sumi)}
.card{position:relative;width:1200px;height:630px;background:linear-gradient(180deg,#1E272C,#11171A);color:var(--gin);font-family:"Zen Kaku Gothic New",sans-serif}
canvas{position:absolute;inset:0}
.txt{position:absolute;left:72px;top:64px;width:560px}
.mark{display:flex;align-items:flex-start;gap:18px}
.mark h1{margin:0;font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:176px;line-height:1;letter-spacing:.02em}
.mark span{writing-mode:vertical-rl;font-family:"Shippori Mincho B1",serif;font-weight:500;font-size:22px;letter-spacing:.5em;color:var(--nezu);padding-top:10px}
.copy{margin:34px 0 0;font-family:"Shippori Mincho B1",serif;font-weight:500;font-size:33px;line-height:1.55;letter-spacing:.06em}
.places{margin:20px 0 0;font-size:19px;letter-spacing:.08em;color:var(--nezu)}
.places b{color:var(--andon);font-weight:500}
.strip{margin:30px 0 0;display:flex;align-items:center;gap:16px;font-family:"DM Mono",monospace;font-size:17px;color:var(--nezu)}
.strip i{display:block;width:300px;height:7px;border-radius:1px}
.foot{position:absolute;left:72px;bottom:44px;font-size:16px;letter-spacing:.12em;color:var(--nezu)}
</style>
</head>
<body>
<div class="card">
  <canvas id="cv" width="1200" height="630"></canvas>
  <div class="txt">
    <div class="mark"><h1>雨音</h1><span>あまおと</span></div>
    <p class="copy">雨が当たる場所と強さを選んで、<br>雨音を聴く。</p>
    <p class="places">番傘・トタン屋根・瓦・窓ガラス・テント…　<b>12か所</b></p>
    <div class="strip"><i id="strip"></i><span>0.5–100 mm/h</span></div>
  </div>
  <p class="foot">音は録音ではなく、ブラウザの中でひと粒ずつ合成</p>
</div>
<script>
// 決定的な乱数（毎回同じ絵になるように）
let seed=7;const R=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const rnd=(a,b)=>a+R()*(b-a),TAU=Math.PI*2;
const W=1200,H=630,c=document.getElementById('cv').getContext('2d');

// 雨雲レーダーの色帯（アプリと同じ配色・対数目盛）
const RADAR=[[0.5,1,'#F2F2FF'],[1,5,'#A0D2FF'],[5,10,'#218CFF'],[10,20,'#0041FF'],[20,30,'#FAF500'],[30,50,'#FF9900'],[50,80,'#FF2800'],[80,100,'#B40068']];
const pos=m=>Math.log(m/.5)/Math.log(200)*100;
document.getElementById('strip').style.background='linear-gradient(90deg,'+RADAR.map(([a,b,col])=>`${col} ${pos(a).toFixed(2)}% ${pos(b).toFixed(2)}%`).join(',')+')';

// 番傘（アプリの drawUmbrella を簡略化）
const cx=905,Rr=240,y0=190,Hc=Rr*.36,e=Rr*.13,rimY=y0+Hc,ground=580;
const n=40,front=[];
for(let i=0;i<n;i++){const th=i/n*TAU;if(Math.sin(th)>1e-6)front.push({x:cx+Rr*Math.cos(th),y:rimY+e*Math.sin(th)})}
front.sort((a,b)=>b.x-a.x);
const hitY=x=>{const u=(x-cx)/Rr;return Math.abs(u)<=1?y0+Hc*u*u:ground};

// 遠くの雨
const w=.09;
c.strokeStyle='rgba(190,205,212,.14)';c.lineWidth=.8;c.beginPath();
for(let i=0;i<520;i++){const x=rnd(-40,W+40),y=rnd(-20,H),l=rnd(8,14);c.moveTo(x,y);c.lineTo(x-l*w,y-l)}c.stroke();

// 地面
c.strokeStyle='rgba(140,155,161,.25)';c.lineWidth=1;c.beginPath();c.moveTo(640,ground);c.lineTo(W,ground);c.stroke();
// 柄
c.strokeStyle='rgba(216,180,106,.8)';c.lineWidth=4;c.lineCap='round';c.beginPath();c.moveTo(cx,y0);c.lineTo(cx,rimY+Rr*.95);c.stroke();c.lineCap='butt';
// 受け骨
const hub=rimY+Rr*.3;c.strokeStyle='rgba(216,180,106,.28)';c.lineWidth=1;c.beginPath();
for(const t of front){c.moveTo(cx,hub);c.lineTo(t.x,t.y)}c.stroke();
c.fillStyle='rgba(216,180,106,.6)';c.fillRect(cx-4,hub-5,8,10);
// 傘布
c.beginPath();c.moveTo(cx-Rr,rimY);c.quadraticCurveTo(cx,y0-Hc,cx+Rr,rimY);c.ellipse(cx,rimY,Rr,e,0,0,Math.PI,false);c.closePath();
c.fillStyle='rgba(216,180,106,.26)';c.fill();c.strokeStyle='rgba(216,180,106,.85)';c.lineWidth=1.3;c.stroke();
// 親骨
c.strokeStyle='rgba(216,180,106,.38)';c.lineWidth=.8;c.beginPath();
for(const t of [...front,{x:cx+Rr,y:rimY},{x:cx-Rr,y:rimY}]){const dx=t.x-cx;c.moveTo(cx,y0);c.quadraticCurveTo(cx+dx*.55,y0+(t.y-y0)*.15,t.x,t.y)}c.stroke();
c.beginPath();c.moveTo(cx-Rr*.18,y0+Hc*.1);c.quadraticCurveTo(cx,y0-Hc*.08,cx+Rr*.18,y0+Hc*.1);c.strokeStyle='rgba(216,180,106,.7)';c.lineWidth=2;c.stroke();
c.strokeStyle='rgba(216,180,106,.85)';c.lineWidth=1.5;c.beginPath();c.moveTo(cx,y0);c.lineTo(cx,y0-10);c.stroke();

// 手前の雨（傘に当たると止まり、しぶきが上がる）。文字の上は薄くする
const sparks=[];
c.lineWidth=1.1;
for(let i=0;i<220;i++){
  const x=rnd(560,W+20),hy=hitY(x),l=rnd(16,30),y=rnd(-20,H+40);
  if(y>hy+l)continue; // 傘の下には降らない
  const ye=Math.min(y,hy);
  c.strokeStyle='rgba(205,218,224,.42)';c.beginPath();c.moveTo(x,ye);c.lineTo(x-l*w,ye-l);c.stroke();
  if(ye===hy&&hy<ground)sparks.push([x,hy]);
}
for(let i=0;i<90;i++){
  const x=rnd(-20,560),l=rnd(16,28),y=rnd(-20,H+20);
  c.strokeStyle='rgba(205,218,224,.16)';c.beginPath();c.moveTo(x,y);c.lineTo(x-l*w,y-l);c.stroke();
}
// 傘の上のしぶき
c.fillStyle='rgba(200,214,220,.7)';
for(let i=0;i<60;i++){const x=rnd(cx-Rr+10,cx+Rr-10),y=hitY(x);for(let k=0;k<2;k++){c.globalAlpha=rnd(.3,.8);c.fillRect(x+rnd(-8,8),y-rnd(2,16),1.4,1.4)}}
for(const [x,y] of sparks){c.globalAlpha=rnd(.3,.7);c.fillRect(x+rnd(-6,6),y-rnd(2,12),1.4,1.4)}
c.globalAlpha=1;
// 傘の縁から落ちるしずくと、地面の波紋
for(const t of [front[3],front[9],front[15]].concat([{x:cx+Rr,y:rimY},{x:cx-Rr,y:rimY}])){
  const dy=rnd(40,200);c.fillStyle='rgba(200,214,220,.8)';c.fillRect(t.x-.8,t.y+dy,1.6,6);
}
c.strokeStyle='rgba(200,214,220,.45)';c.lineWidth=1;
for(const x of [cx-Rr,cx+Rr,front[9].x]){c.beginPath();c.ellipse(x,ground,12,3.4,0,0,TAU);c.stroke()}
</script>
</body>
</html>
